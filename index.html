<!doctype html>
<html lang="en" class="dark theme-blue">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CollabSpace: Collaborative Workspace for Code and Education</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('collabspace-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
          var accent = localStorage.getItem('collabspace-accent') || 'theme-blue';
          document.documentElement.classList.remove('theme-blue', 'theme-mint', 'theme-amber');
          document.documentElement.classList.add(accent);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-text-main antialiased selection:bg-accent/20 selection:text-accent">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
